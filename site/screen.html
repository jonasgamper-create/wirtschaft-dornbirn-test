<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://wirtschaft-reservierung.jonas-gamper.workers.dev wss://wirtschaft-reservierung.jonas-gamper.workers.dev; form-action 'none'; upgrade-insecure-requests">
  <meta name="theme-color" content="#f3efe6">
  <title>Willkommen · Wirtschaft Dornbirn</title>
  <link rel="icon" href="assets/wirtschaft-logo.png" type="image/png">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/montserrat-latin-400-normal.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/montserrat-latin-600-normal.woff2" crossorigin>
  <link rel="stylesheet" href="screen.css?v=78909573">
  <link rel="stylesheet" href="floorplan.css?v=f65484ba">
  <script type="module" src="screen.js?v=5e1c1288"></script>
</head>
<body>
  <header class="sc-head">
    <img src="assets/wirtschaft-logo.png" width="300" height="69" alt="Wirtschaft Dornbirn">
    <div class="sc-when">
      <span class="sc-clock" id="scClock">—</span>
      <span class="sc-count" id="scCount"></span>
    </div>
  </header>

  <p class="sc-link" id="scLink" role="status" aria-live="polite" hidden></p>

  <main class="sc-main">
    <!-- Fertige Abholungen stehen oben, weil sie die einzige zeitkritische
         Auskunft auf diesem Bildschirm sind: ein Tisch wartet, ein Essen wird
         kalt. Sie sind zugleich die kostenlose Benachrichtigung fuer jeden,
         der ohnehin schon im Haus steht - ganz ohne Telefon und Browser.
         Nummer und Vorname genuegen zum Wiedererkennen; mehr gibt der Dienst
         fuer diesen Bildschirm auch gar nicht heraus. Ist nichts fertig,
         verschwindet der ganze Abschnitt: eine leere Ueberschrift am Eingang
         sieht aus wie ein Fehler. -->
    <section class="sc-abholung" id="scAbholung" aria-labelledby="scAbholTitel" hidden>
      <h2 class="sc-title" id="scAbholTitel">Abholbereit</h2>
      <div class="sc-abhol-liste" id="scAbholListe" aria-live="polite"></div>
    </section>

    <section aria-labelledby="scTitle">
      <h1 class="sc-title" id="scTitle">Ihr Tisch</h1>
      <div class="sc-list" id="scList" aria-live="polite"></div>
    </section>

    <section class="sc-plan" aria-label="Saalplan">
      <div data-floorplan id="scPlan"></div>
    </section>
  </main>

  <footer class="sc-foot">
    <span>Wirtschaft Dornbirn · Bahnhofstraße&nbsp;24 · 6850 Dornbirn</span>
    <div class="sc-tools">
      <button type="button" id="scNames">Namen: vollständig</button>
      <button type="button" id="scFull">Vollbild</button>
    </div>
  </footer>
</body>
</html>
