<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <meta name="description" content="Aktuelle Mittagskarte der Wirtschaft Dornbirn zum Ansehen und als PDF speichern.">
  <meta name="robots" content="noindex,nofollow">
  <title>Mittagskarte · Wirtschaft Dornbirn</title>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/montserrat-latin-400-normal.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/montserrat-latin-600-normal.woff2" crossorigin>
  <style>
@font-face{font-family:Montserrat;font-style:normal;font-weight:400;font-display:swap;
  src:url("assets/fonts/montserrat-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:Montserrat;font-style:normal;font-weight:600;font-display:swap;
  src:url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:Montserrat;font-style:normal;font-weight:700;font-display:swap;
  src:url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2")}
:root{
  --ink:#11110f;--paper:#f3efe6;--cream:#ead9bc;--wine:#8c292b;--green:#244635;--gold:#c59b5d;
  --grau:#57524a;
  --sans:Montserrat,"Helvetica Neue",Arial,sans-serif;
}
doc-page:not(:defined){visibility:hidden}
body{margin:0;font-family:var(--sans);color:var(--ink);text-transform:lowercase;
  -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:var(--wine)}
a:hover{color:var(--ink)}

/* Die Leiste gehoert zur Bedienung, nicht zur Karte - sie wird nicht gedruckt. */
.leiste{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;padding:14px clamp(16px,4vw,40px);background:var(--ink);color:var(--paper);
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.leiste a,.leiste button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  padding:0 18px;border:1px solid var(--paper);border-radius:999px;background:transparent;
  color:var(--paper);font:inherit;font-size:14.5px;text-decoration:none;text-transform:lowercase;cursor:pointer}
.leiste button{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.leiste-wege{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.leiste p{margin:0;font-size:14.5px}

/* Das Blatt: weiss, ein duenner Rahmen, viel Luft - gegliedert wie die
   Mittagskarte des Hauses. Wenig Farbe: die Woche in Gold, der Rest in
   Schwarz und Grau auf Weiss. */
doc-page{--doc-page-w:calc(100vw - 20px);--doc-page-margin:20px}
.blatt{border:1px solid var(--ink);padding:12mm 12mm 12mm;min-height:calc(100% - 2px)}
.kopf{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10pt 16pt;
  padding-bottom:10pt;margin-bottom:12pt;border-bottom:1.5px solid var(--ink)}
.kopf img{display:block;width:150px;height:auto}
.kopf h1{margin:0;font-size:26pt;font-weight:600;letter-spacing:-.02em;line-height:1;text-align:center}
.kopf h1 small{display:block;margin-top:5pt;color:var(--gold);font-size:11pt;font-weight:600;letter-spacing:.01em}
.kopf-meta{margin:0;color:var(--grau);font-size:9pt;line-height:1.55;text-align:right;white-space:nowrap}

.karte-gruppe{display:flex;align-items:baseline;gap:8pt;margin:0;padding:0 0 4pt;border-bottom:1.5px solid var(--ink);
  font-size:15pt;font-weight:600;letter-spacing:-.01em}
.karte-gruppe .karte-fenster{font-size:9.5pt;font-weight:400;color:var(--grau);letter-spacing:0}
.karte-hinweis{margin:5pt 0 0;color:var(--grau);font-size:9.5pt}
.gruppe + .gruppe{margin-top:18pt}

.karte-zeile{display:grid;grid-template-columns:1fr auto;column-gap:14pt;padding:6pt 0;
  border-bottom:1px solid #11110f1f;break-inside:avoid}
.karte-name{grid-column:1;margin:0;font-size:10.5pt;font-weight:600;line-height:1.3}
.karte-praefix{font-weight:600}
.karte-preis{grid-column:2;grid-row:1;font-size:10.5pt;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.karte-beilage{grid-column:1;margin:1.5pt 0 0;color:var(--grau);font-size:9.5pt;line-height:1.35}

.fuss{margin:18pt 0 0;padding-top:8pt;border-top:1.5px solid var(--ink);color:var(--grau);font-size:9pt;line-height:1.55}
.fuss b{color:var(--ink)}
.legende{margin:8pt 0 0;color:var(--grau);font-size:8pt;line-height:1.5}
.laden{margin:0;padding:24pt 0;color:var(--grau);font-size:11pt}

/* Am Handy nur die Knoepfe: der Satz kostete 60 px, die Knoepfe sind Weg
   genug. Die Leiste war 179 px hoch - ein Fuenftel des Bildschirms. */
@media(max-width:560px){.leiste p{display:none}.leiste{gap:10px}}
@media print{
  .leiste{display:none}
  body{text-transform:lowercase}
  .blatt{border-color:var(--ink)}
}
  </style>
</head>
<body>
  <nav class="leiste" aria-label="Bedienung">
    <p>Die Mittagskarte der Woche – so kommt sie auch an den Tisch.</p>
    <div class="leiste-wege">
      <a href="tischreservierung.html">Zur Reservierung</a>
      <a href="takeaway.html">Zum Takeaway</a>
      <button type="button" id="drucken">Als PDF speichern</button>
    </div>
  </nav>

  <doc-page size="a4" margin="10mm">
    <div class="blatt">
      <header class="kopf">
        <img src="assets/logo.png" width="300" height="69" alt="„wirtschaft“ – cafe restaurant bar">
        <h1>mittagskarte<small id="wochenText">&nbsp;</small></h1>
        <p class="kopf-meta">bahnhofstraße 24 · 6850 dornbirn<br>+43 (0)5572 20 540<br><span id="stand"></span></p>
      </header>

      <section class="gruppe" id="woche"><p class="laden">Die Karte wird geladen.</p></section>
      <section class="gruppe" id="alacarte"></section>

      <p class="fuss" id="fuss" hidden></p>
      <p class="legende" id="legende" hidden></p>
    </div>
  </doc-page>

  <script src="doc-page.js"></script>
  <script type="module" src="mittagskarte.js"></script>
</body>
</html>
