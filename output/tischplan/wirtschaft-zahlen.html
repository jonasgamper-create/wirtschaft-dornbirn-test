<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; img-src data:; font-src 'self'; style-src 'sha256-qlafvenLtYoWjUfx81WdNjoCJzYb1Gr/PV35wfYKKmU='; script-src 'sha256-rM+QPauIGGSlh1TBhNirqH0kD5Z5U7H59DaPln9lHlc='; connect-src https://wirtschaft-reservierung.jonas-gamper.workers.dev wss://wirtschaft-reservierung.jonas-gamper.workers.dev; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#11110f">
  <title>Monatszahlen · Wirtschaft Dornbirn</title>
  <style>
/* Die einfache Wirt-Ansicht. Handy zuerst: grosse Ziffern, grosse Knoepfe,
   nichts zum Suchen. Farben und Schrift aus der bestehenden Wirtschaft-CI. */
:root{
  --ink:#11110f;--paper:#f3efe6;--cream:#ead9bc;--wine:#8c292b;--green:#244635;--gold:#c59b5d;
  --muted:#57524a;--linie:#11110f26;
  font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:3px}

.kopf{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(18px,4vw)}
.kopf img{width:150px;height:auto}
.verbindung{display:flex;align-items:center;gap:8px;margin:0;color:var(--muted);font-size:12.5px}
.verbindung i{width:9px;height:9px;border-radius:50%;background:#a29b90}
.verbindung[data-zustand="verbunden"] i{background:var(--green)}
.verbindung[data-zustand="getrennt"] i{background:var(--wine)}

main{width:min(680px,100%);margin:0 auto;padding:0 max(18px,4vw) 64px}
section{padding:26px 0;border-top:1px solid var(--linie)}
section:first-child{border-top:0}
h1,h2{font-family:Montserrat,-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;font-weight:400;margin:0}
h2{font-size:24px;margin-bottom:6px}
.vorzeile{margin:0 0 8px;color:var(--green);font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:lowercase}
.hinweis{margin:0 0 14px;color:var(--muted);font-size:14.5px}

/* Die drei Zahlen des Mittags: erwartet, im Haus, frei. Sie sind das Erste,
   was man sieht - und meistens das Einzige, was man wissen muss. */
.zahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 0 22px}
.kachel{display:grid;gap:2px;padding:16px 14px;border:1px solid var(--linie);border-radius:12px;background:#fff}
.kachel b{font-family:Montserrat,-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.kachel span{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:lowercase}
.kachel small{color:var(--muted);font-size:12.5px;min-height:1.2em}

/* Rueckgaengig statt Warndialog: der Balken erscheint nach dem Leeren. */
.korb{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;padding:12px 14px;border:1px solid #a67f45;border-radius:10px;background:var(--gold);color:var(--ink);font-size:14.5px;font-weight:700}
.korb[hidden]{display:none}

.zeile-kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.zeile-kopf h2{margin:0}

/* Telefonische Reservierung: vier Felder, fertig. */
.neu-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px;padding:14px;border:1px solid var(--linie);border-radius:12px;background:#fff}
.neu-form label{display:grid;gap:5px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:lowercase;color:var(--muted)}
.neu-form input{min-height:48px;padding:8px 12px;border:1px solid var(--linie);border-radius:8px;background:#fff;color:var(--ink);font-size:17px;font-weight:400;letter-spacing:0;text-transform:none}
.neu-form .neu-knoepfe{grid-column:1/-1;display:flex;gap:10px}
.neu-form[hidden]{display:none}

/* Die Zeitmarke am Zeilenanfang - die Liste liest sich wie der Tag selbst. */
.haus-liste .zeit{flex:0 0 auto;padding:6px 10px;border:1px solid var(--linie);border-radius:8px;background:var(--paper);font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.haus-liste li[data-ton="spaet"]{border-color:#a67f45;background:#f6ecd9}
.haus-liste li[data-ton="takeaway"]{border-left:3px solid var(--green)}
.haus-liste li .wer{flex:1 1 auto}

/* Laufkundschaft: die Knoepfe sind absichtlich die groessten Elemente der
   Seite - sie sind der Grund, warum es die Seite gibt. */
.lauf-knoepfe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px}
/* Die grosse Gesellschaft: eintippen statt zwanzig Knoepfe. */
.lauf-mehr{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.lauf-mehr label{color:var(--muted);font-size:14.5px}
.lauf-mehr input{width:90px;min-height:48px;padding:8px 12px;border:1px solid var(--linie);border-radius:8px;background:#fff;font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.lauf-knoepfe button{min-height:64px;border:1px solid var(--green);border-radius:12px;background:#fff;color:var(--green);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.lauf-knoepfe button:active{background:var(--green);color:#fff}
.lauf-knoepfe button:disabled{opacity:.4;cursor:default}
.lauf-ergebnis{margin:12px 0 0;min-height:1.4em;font-size:15px;color:#3c3833}
.lauf-ergebnis[data-art="gut"]{color:var(--green);font-weight:700}
.lauf-ergebnis[data-art="fehler"]{color:var(--wine);font-weight:700}

/* Wer sitzt: eine Zeile je Gruppe, ein Knopf je Zeile. */
.haus-liste{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.haus-liste li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--linie);border-radius:10px;background:#fff}
.haus-liste .wer{display:grid;gap:2px;min-width:0}
.haus-liste .wer b{font-size:16px;font-weight:700}
.haus-liste .wer span{color:var(--muted);font-size:13px}
.haus-liste .leer{border-style:dashed;background:transparent;color:var(--muted);justify-content:flex-start;font-size:14.5px}

.knopf{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:1px solid var(--green);border-radius:999px;background:var(--green);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:lowercase;text-decoration:none;cursor:pointer}
.knopf.leise{background:transparent;color:var(--ink);border-color:var(--linie)}
/* [hidden] verliert gegen display:inline-flex der Klassenregel - dieselbe
   Falle wie beim Anrufknopf der Gaesteseite. Einmal explizit, nie wieder raten. */
.knopf[hidden]{display:none}
.karte-knoepfe{display:flex;flex-wrap:wrap;gap:10px}

/* Eingeklappte Werkzeuge: Karte und Takeaway-Karte brauchen den Platz nur,
   wenn man sie wirklich in der Hand hat. */
.werkzeug{padding:16px 0;border-top:1px solid var(--linie)}
.werkzeug summary{min-height:44px;display:flex;align-items:center;font-family:Montserrat,-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;font-size:20px;cursor:pointer}
.werkzeug[open] summary{margin-bottom:10px}
.werkzeug textarea{width:100%;min-height:120px;margin:0 0 10px;padding:10px 12px;border:1px solid var(--linie);border-radius:8px;background:#fff;font:inherit;font-size:14.5px;line-height:1.5;resize:vertical}

/* Kuechenzettel: die empfohlene Zahl steht vorn und gross - sie ist das
   Einzige, was beim Einkaufen zaehlt. Das Gericht daneben, die Herkunft der
   Zahl klein darunter. */
.zettel-liste{display:grid;gap:2px;margin:0 0 12px;padding:0;list-style:none}
.zettel-liste li{display:grid;grid-template-columns:3.2rem minmax(0,1fr);align-items:baseline;gap:2px 12px;padding:9px 0;border-top:1px solid var(--linie)}
.zettel-liste li:first-child{border-top:0}
.zettel-liste .zettel-zahl{grid-row:span 2;font-family:Montserrat,-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.zettel-liste b{font-size:15px;font-weight:700;line-height:1.35}
.zettel-liste small{color:var(--muted);font-size:12.5px;line-height:1.4}

/* Der SMS-Schalter. Er kostet Geld, also ist er ein bewusster Griff und
   kein Haken im Kleingedruckten. */
/* Die Zustaendigkeit fuers Fertigmelden: drei Knoepfe, einer davon gedrueckt.
   Kein Haekchen - es sind drei Faelle, nicht "an oder aus". */
.fertig-wahl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.fertig-wahl .knopf[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
/* Steht der Knopf woanders, bleibt der Platz nicht leer: die Kueche muss
   sehen, was fertig ist, auch wenn sie es nicht selbst umschaltet. */
.knopf-ersatz{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 14px;color:#6d675d;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:lowercase;white-space:nowrap}
.sms-schalter{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 0 8px;font-size:15px;cursor:pointer}
.sms-schalter input{width:26px;height:26px;flex:0 0 auto;accent-color:var(--green)}

/* Die Kuechenansicht teilt das Stilblatt der Wirt-Ansicht, hat aber keinen
   Logo-Kopf - am Herd zaehlt die Liste, nicht die Marke. */
.kueche-marke{margin:0;color:var(--green);font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:lowercase}
.kueche-seite .haus-liste li{padding:14px 16px}
.kueche-seite .haus-liste .wer b{font-size:17px}
.kueche-seite .haus-liste .knopf{min-height:56px;padding:0 24px;font-size:13.5px}

.knopf.rot{background:transparent;color:var(--wine);border-color:var(--wine)}

.fuss{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--linie);color:var(--muted);font-size:13.5px}
.fuss a{color:var(--wine)}
.fuss.abschluss{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:0;padding-top:0}
.fuss.abschluss span{flex:1 1 240px}

@media(max-width:520px){
  .lauf-knoepfe{grid-template-columns:repeat(5,1fr)}
  .lauf-knoepfe button{min-height:64px}
  .haus-liste li{flex-wrap:wrap}
}
.haus-liste li[data-erledigt]{opacity:.55}

/* Neu eingegangen: leuchtet gold, bis die Zeile einmal angetippt wurde. */
.haus-liste li[data-neu]{border-color:var(--gold,#c59b5d);background:#c59b5d22}
.haus-liste li[data-party]{cursor:pointer}
.haus-liste .wer .wunsch{color:#8c6a2f;font-size:13px}
/* Stammgast: gruen, weil es eine gute Nachricht ist - im Gegensatz zum
   goldenen Wunsch, der eine Aufgabe ist. */
.haus-liste .wer .stammgast{color:var(--green);font-size:13px;font-weight:700}

/* Das Aktionsblatt. Ein Blatt, drei Griffe: Tisch, Personen, Notiz. */
.blatt{width:min(560px,calc(100vw - 24px));border:1px solid var(--linie);border-radius:14px;padding:18px 18px 16px;background:#fff}
.blatt::backdrop{background:#11110f66}
.blatt-kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.blatt-kopf b{display:block;font-size:18px}
.blatt-kopf span{display:block;margin-top:2px;color:var(--muted);font-size:13.5px}
.blatt-notiz{margin:10px 0 0;padding:10px 12px;border-left:2px solid var(--gold,#c59b5d);background:#c59b5d1c;color:#5b451d;font-size:14px}
.blatt-teil{margin-top:16px}
.blatt-teil h3{margin:0 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:lowercase;color:var(--muted)}
.blatt-tische{display:flex;flex-wrap:wrap;gap:8px}
.blatt-tische button{min-height:46px;padding:0 14px;border:1px solid var(--linie);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:14.5px;cursor:pointer}
.blatt-tische button:hover{border-color:var(--green)}
.blatt-tische button.leise{color:var(--muted)}
.blatt-leer{margin:0 0 4px;color:var(--muted);font-size:14px;flex:1 1 100%}
.blatt-zeile{display:flex;gap:10px}
.blatt-zeile input{flex:1;min-height:48px;padding:8px 12px;border:1px solid var(--linie);border-radius:8px;background:#fff;font:inherit;font-size:16px}
.blatt-zeile input[type="number"]{max-width:110px;text-align:center;font-variant-numeric:tabular-nums}

/* "+10 Min" steht neben dem Fertig-Knopf, aber leiser: es ist die seltenere
   Handlung, und im Mittag darf nichts mit dem grossen Knopf verwechselt
   werden. */
.kueche-seite .haus-liste .knopf.spaeter{min-height:56px;padding:0 14px;font-size:12px}

/* ---- Eigene Termine -------------------------------------------------------- */
.event-liste{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.event-liste li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid #11110f1f;border-radius:10px;background:#fff}
.event-liste li.leer{border-style:dashed;color:#8f887b;grid-template-columns:1fr}
.event-wann{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.event-was{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-form{display:grid;gap:10px}
.event-form label{display:grid;gap:5px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:lowercase}
.event-form input{min-height:46px;padding:10px 12px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none}
.event-form-zeile{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.event-form-zeile{grid-template-columns:1fr}}

/* ---- Uebersichtsseite ------------------------------------------------------ */
.uebersicht-seite .zahlen{grid-template-columns:repeat(4,1fr)}
@media(max-width:700px){.uebersicht-seite .zahlen{grid-template-columns:1fr 1fr}}
.uebersicht-seite .marke{margin:0;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:lowercase}
.uebersicht-seite h1{margin:2px 0 0;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}
/* Kein Zuklappen auf einer Seite, die nur zum Anschauen da ist. */
.werkzeug.offen-immer h2{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:lowercase}
.aufgaben-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.aufgaben-liste li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border:1px solid #c59b5d66;border-radius:10px;background:#c59b5d14}
.aufgaben-liste li.leer{border-color:#11110f1f;background:#fff;color:#8f887b;border-style:dashed}
.aufgaben-liste a{white-space:nowrap;font-weight:700}
.werkzeug-links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.werkzeug-links{grid-template-columns:1fr}}
.werkzeug-links a{display:grid;gap:3px;padding:14px;border:1px solid #11110f1f;border-radius:10px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700}
.werkzeug-links a:hover{border-color:var(--green)}
.werkzeug-links small{color:var(--muted);font-weight:400}

/* ---- Tische sperren -------------------------------------------------------- */
.sperre-liste{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.sperre{display:grid;gap:1px;justify-items:center;min-width:72px;min-height:56px;padding:8px 10px;border:1px solid #11110f3d;border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.sperre b{font-size:18px;font-variant-numeric:tabular-nums}
.sperre span{font-size:11px;color:var(--muted)}
/* Gesperrt sieht gesperrt aus: durchgestrichen und blass - dieselbe Sprache
   wie die vollen Uhrzeiten auf der Gaesteseite. */
.sperre.zu{border-style:dashed;background:#11110f08;color:#a29b90;text-decoration:line-through}
.sperre.zu span{color:#a29b90}

/* ---- Tische & Stuehle ueber Anzahlen --------------------------------------- */
.bestand-liste{display:grid;gap:14px;margin:0 0 14px}
.bestand-etage h4{margin:0 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:lowercase;color:var(--muted)}
.bestand-leer{margin:0;color:#8f887b;font-size:14px}
.bestand-zeile{display:grid;grid-template-columns:minmax(0,1fr) 52px 56px 52px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #11110f14}
.bestand-zeile span{font-size:16px}
.bestand-zeile b{text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
/* Grosse Tasten: das hier wird im Stehen bedient, mit dem Daumen. */
.bestand-zeile button{min-height:52px;border:1px solid #11110f3d;border-radius:10px;background:#fff;color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.bestand-zeile button:active{background:#11110f0a}
.bestand-neu{display:flex;align-items:end;gap:10px;margin:4px 0 10px}
.bestand-neu label{display:grid;gap:5px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:lowercase}
.bestand-neu select{min-height:46px;padding:8px 10px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font-size:16px}


/* Textlinks in Hinweisen und im Fuss: unsichtbar vergroesserte Tippflaeche.
   16 Pixel Zeilenhoehe treffen Finger nicht - 44 schon. */
.hinweis a,.fuss a,.model-note a{padding:13px 0;margin:-13px 0}

/* ---- Einrichten-Seite ------------------------------------------------------ */
.einrichten-lead{max-width:56ch}
.ordnung-liste{display:grid;gap:8px;margin:0 0 14px}
.ordnung-zeile{display:flex;gap:8px;align-items:stretch}
.ordnung{flex:1;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border:1px solid #11110f3d;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;text-align:left}
.ordnung b{font-size:16px}
.ordnung span{color:var(--muted);font-size:13px;white-space:nowrap}
.ordnung.aktiv{border-color:var(--green);background:var(--green);color:#fff}
.ordnung.aktiv span{color:#dfe8e1}
.ordnung-weg{align-self:center}
.ordnung-neu{display:flex;align-items:end;gap:10px;margin-top:4px}
.ordnung-neu label{flex:1;display:grid;gap:5px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:lowercase}
.ordnung-neu input{min-height:46px;padding:10px 12px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none}
.etage-kopf{display:flex;gap:10px;align-items:center;margin:0 0 6px}
.etage-kopf input{flex:1;min-height:46px;padding:8px 12px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font-size:16px;font-weight:700}
.groesse-neu{display:flex;gap:10px;align-items:center;margin-top:10px}
.groesse-neu select{min-height:46px;padding:8px 10px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font-size:15px}
.betrieb-zeilen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.betrieb-zeilen{grid-template-columns:1fr}}
.betrieb-zeilen label{display:grid;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:lowercase}
.betrieb-zeilen select{min-height:52px;padding:8px 12px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none}

/* ---- Zusperren ------------------------------------------------------------- */
.zu-form{display:flex;align-items:end;gap:10px;margin:0 0 12px}
.zu-form label{display:grid;gap:5px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:lowercase}
.zu-form input{min-height:46px;padding:8px 12px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font-size:16px}
.zu-liste{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.zu-liste li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border:1px dashed #11110f3d;border-radius:10px;background:#11110f05;color:#57524a}
.zu-liste li.leer{border-style:solid;border-color:#11110f1f;background:#fff;color:#8f887b}
/* Der Absage-Knopf ist ROT: er schickt Mails hinaus, das ist keine
   Umsortierung. Wein ist der Ton des Hauses fuer "Achtung". */
.knopf.warn{background:var(--wine);border-color:var(--wine);color:#fff}
.zu-absage{display:grid;gap:8px;margin:0 0 8px}

/* ---- Laptop und Bildschirm ------------------------------------------------
 *
 * Handy zuerst bleibt richtig: der Wirt hat im Betrieb das Telefon in der
 * Hand. Aber dieselben Seiten liegen auch auf dem Laptop im Buero und auf
 * dem Bildschirm in der Kueche - dort stand die Telefonspalte mitten in
 * einer leeren Flaeche, gemessen 680 von 1280 Pixel, und der Rest des
 * Bildschirms trug nichts bei. Wer die Werkzeuge sehen wollte, scrollte an
 * der Tagesliste vorbei, obwohl daneben Platz war.
 *
 * Ab 1040 Pixel wird die Rolle deshalb zu einer Flaeche: was zusammen
 * gebraucht wird, steht nebeneinander. Nichts wird neu erfunden - dieselben
 * Kacheln, dieselben Abstaende, dieselben Farben, nur anders angeordnet.
 * Unterhalb der Grenze bleibt alles, wie es am Telefon war.
 */
@media(min-width:1040px){
  main{width:min(1120px,100%)}

  /* Das Cockpit ist eine Uebersicht - also darf es auch wie eine aussehen:
     die vier Zahlen ueber die volle Breite, darunter zwei Spalten. */
  .uebersicht-seite main{display:grid;grid-template-columns:1.05fr .95fr;column-gap:46px;align-items:start}
  .uebersicht-seite main>.zahlen{grid-column:1/-1}
  .uebersicht-seite main>p.fuss{grid-column:1/-1}

  /* Der Tag links, die Werkzeuge rechts. Die Tagesliste ist das Herz der
     Seite und bekommt die breitere Spalte; Laufkundschaft und Werkzeuge
     stehen daneben, ohne dass jemand daran vorbeiscrollen muss.
     Die rechte Spalte ist ein eigener Behaelter im HTML - mit Zeilenspannen
     im Raster rutschten die Kaesten auseinander, sobald die Tagesliste
     laenger wurde als sie. */
  /* Seit 04.09. sind alle Abschnitte gleichrangige Bloecke in einem Raster:
     nur so kann der Wirt sie frei sortieren (wirt-ansicht.mjs). Zwei Spalten,
     die Bloecke fliessen in ihrer Reihenfolge hinein - der erste links, der
     zweite rechts. Wer den Menueplan neben dem Tag sehen will, stellt ihn in
     den Einstellungen davor. align-items:start, damit ein kurzer Block nicht
     auf die Hoehe seines Nachbarn gezogen wird. */
  .wirt-seite .wirt-bloecke{display:grid;grid-template-columns:1.15fr 1fr;
    column-gap:46px;align-items:start}
  /* Die Zahlen sind eine Kopfzeile, kein Kasten - sie laufen ueber beides.
     Der Menueplan ebenso: in einer halben Spalte war er 3700 Pixel lang und
     liess daneben 3500 Pixel Leerraum stehen. Ueber die volle Breite passt
     ein Gericht in EINE Zeile - aus vier Reihen je Gericht wird eine, der
     Kasten schrumpft auf ein Viertel und alles darunter ist wieder in
     Reichweite. */
  .wirt-seite .wirt-bloecke>[data-block="zahlen"],
  .wirt-seite .wirt-bloecke>[data-block="planKasten"],
  .wirt-seite .wirt-bloecke>[data-block="einstellungen"]{grid-column:1/-1}
  .wirt-seite .plan-gericht{grid-template-columns:minmax(0,2fr) minmax(0,2.3fr) minmax(0,.85fr) minmax(0,.85fr) auto auto;
    align-items:end;column-gap:10px}
  .wirt-seite .plan-gericht .plan-breit{grid-column:auto}
  .wirt-seite .plan-form .plan-haken{grid-column:auto;white-space:nowrap;gap:7px}
  .wirt-seite .plan-kopf{grid-template-columns:repeat(3,minmax(0,1fr));max-width:720px}
  .wirt-seite .plan-kopf-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr);max-width:720px}
  .wirt-seite .plan-kopf-1{max-width:340px}
  /* Die Laufkundschaft ist der groesste Knopf der Seite und bleibt es auch
     hier - nur nicht breiter als noetig, sonst wird aus dem Knopf ein Band. */
  .wirt-seite .lauf-knoepfe{max-width:none}

  /* Die Kueche: zu kochen links, fertig rechts. Auf einem Bildschirm an der
     Wand ist das der ganze Sinn - beide Listen ohne Scrollen im Blick. */
  .kueche-seite main{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;align-items:start}
  .kueche-seite main>.zahlen{grid-column:1/-1}
  .kueche-seite main>p.fuss{grid-column:1/-1}

  /* Einrichten bleibt eine Spalte: ein Formular, das ueber die ganze Breite
     laeuft, liest sich schlechter, nicht besser. Nur etwas mehr Luft. */
  .einrichten-seite main{width:min(860px,100%)}
}

/* Ganz breite Bildschirme: mehr Spalten fuer die Zahlen, nicht mehr Breite
   fuer den Text. Eine Zeile Text, die ueber 1400 Pixel laeuft, verliert das
   Auge am Rand. */
@media(min-width:1400px){
  main{width:min(1240px,100%)}
  .wirt-seite .wirt-bloecke{grid-template-columns:1.25fr 1fr}
}


/* ===== monatszahlen ===== */
.monat-blaettern{display:flex;gap:8px;margin:0}
.monat-blaettern button{min-width:48px;min-height:44px;border:1px solid #11110f33;border-radius:10px;
  background:#fff;font-size:18px;cursor:pointer}
.gerichte-liste{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.gerichte-liste li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.gericht-name{font-weight:600;overflow-wrap:anywhere}
.gerichte-liste b{font-variant-numeric:tabular-nums;grid-column:2;grid-row:1}
/* Der Balken in der zweiten Zeile, ueber beide Spalten - auf dem Handy
   bleibt so die volle Breite fuers Verhaeltnis. */
.gericht-balken{grid-column:1/-1;display:block;height:10px;border-radius:5px;background:#244635}
.gerichte-liste li:nth-child(n+4) .gericht-balken{background:#24463599}
.tage-liste{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tage-liste li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #11110f14}
.tage-liste li span{font-weight:600}
.zahlen-seite .zahlen{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* ===== menueplan der woche =====
   Handy zuerst: Felder untereinander, am Rechner je Gericht eine Reihe.
   Die Eingaben bleiben Schreibschrift (kein lowercase-Zwang), sonst laese
   der Wirt seine eigenen Namen anders, als er sie tippt. */
.plan-form{display:grid;gap:14px;margin-bottom:14px}
.plan-kopf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.plan-form label{display:grid;gap:4px;min-width:0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:lowercase}
.plan-form input{min-height:46px;width:100%;padding:8px 12px;border:1px solid var(--linie);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none}
.plan-form input::placeholder{color:#a29b90}
.plan-form fieldset{margin:0;padding:12px;border:1px solid var(--linie);border-radius:10px;display:grid;gap:10px;min-width:0}
.plan-form legend{padding:0 6px;color:var(--green);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:lowercase}
.plan-form fieldset .hinweis{margin:0}
.plan-liste{display:grid;gap:10px}
/* Je Gericht zwei Reihen: oben Gericht und Beilagen in voller Breite, darunter
   Allergene, Preis und der Entfernen-Knopf. Fuenf Spalten nebeneinander
   passten in die 680 px der Wirt-Ansicht nicht - die Felder waren 60 px
   schmal, "cordon bleu vom schwein" wurde zu "cordon ble". */
.plan-gericht{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding-bottom:10px;border-bottom:1px dashed var(--linie)}
.plan-gericht .plan-breit{grid-column:1/-1}
.plan-gericht:last-child{padding-bottom:0;border-bottom:0}
/* Hoch, runter, weg - drei gleich grosse Knoepfe je Gericht. Sie stehen
   zusammen, damit klar ist, dass sie zu DIESER Zeile gehoeren. */
.plan-werkzeuge{display:flex;gap:6px;align-items:end}
.plan-pfeil,.plan-weg{width:46px;min-height:46px;padding:0;border:1px solid var(--linie);
  border-radius:8px;background:transparent;font-size:18px;line-height:1;color:var(--ink)}
.plan-weg{color:var(--wine);font-size:22px}
.plan-weg-sicher{background:var(--wine);border-color:var(--wine);color:#fff;font-size:15px;font-weight:700}
/* Die verschobene Zeile leuchtet kurz auf - sonst sieht man beim Klick
   nicht, WAS sich bewegt hat. */
@keyframes planBewegt{from{background:#c59b5d38}to{background:transparent}}
.plan-bewegt{animation:planBewegt .7s ease}
@media(prefers-reduced-motion:reduce){.plan-bewegt{animation:none}}
.plan-form .knopf.klein{min-height:44px;padding:0 14px;font-size:13px;justify-self:start}
@media(max-width:700px){
  .plan-kopf{grid-template-columns:1fr}
}

/* Gliederung wie auf der Karte: die Tage stehen als Ueberschriften IN der
   Gruppe "wochengerichte", nicht als eigene Kaesten. Zeitfenster und Hinweis
   stehen im Kopf der Gruppe, die Fussnote hat ein eigenes Textfeld. */
.plan-kopf-2{grid-template-columns:1fr 2fr}
.plan-kopf-1{grid-template-columns:1fr}
.plan-tag{display:grid;gap:10px;padding-top:6px;border-top:1px dashed var(--linie)}
.plan-tag h3{margin:0;color:var(--ink);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:lowercase}
.plan-form textarea{width:100%;min-height:96px;margin:0;padding:10px 12px;border:1px solid var(--linie);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none;resize:vertical}
@media(max-width:700px){.plan-kopf-2{grid-template-columns:1fr}}

/* ===== einstellungen: welche abschnitte, in welcher reihenfolge ===== */
.ansicht-liste{display:grid;gap:2px;margin:0 0 14px;padding:0;list-style:none}
.ansicht-zeile{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:4px 0;border-bottom:1px solid var(--linie)}
.ansicht-zeile:last-child{border-bottom:0}
.ansicht-name{display:flex;align-items:center;gap:12px;min-height:48px;flex:1;min-width:0;cursor:pointer}
.ansicht-name input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--green)}
.ansicht-name span{font-size:15px;line-height:1.3}
.ansicht-pfeile{display:flex;gap:6px;flex:0 0 auto}
.ansicht-pfeil{width:48px;min-height:48px;padding:0;border:1px solid var(--linie);border-radius:10px;
  background:transparent;color:var(--ink);font-size:17px;line-height:1}
.ansicht-pfeil:disabled{opacity:.3}

/* Die Tischzuweisung im Gaesteblatt haengt am selben Schalter wie die
   Kaesten - ist sie aus, zeigt das Blatt nur Personenzahl und Notiz. */
.ohne-tischzuweisung .blatt-tisch-teil{display:none}

/* Der Haken "auch zum mitnehmen" steht in der Zeile des Gerichts, nicht in
   einer eigenen Spalte: er gehoert zum Gericht, und eine sechste Spalte
   waere am Telefon nicht mehr zu treffen. */
.plan-form .plan-haken{display:flex;align-items:center;gap:9px;min-height:48px;grid-column:1/-1;
  color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:lowercase;cursor:pointer}
.plan-form .plan-haken input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--green)}
.plan-form .plan-haken span{font:inherit}

/* A la carte und die Fussnote aendern sich selten - sie liegen eingeklappt,
   damit der Menueplan-Kasten am Laptop nicht 7900 Pixel lang wird und der
   Kuechenzettel darunter unerreichbar weit unten steht. */
.plan-form details.plan-zu{margin:0;padding:12px;border:1px solid var(--linie);border-radius:10px}
.plan-form details.plan-zu>summary{display:flex;align-items:center;min-height:48px;
  color:var(--green);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:lowercase;cursor:pointer}
.plan-form details.plan-zu[open]>summary{margin-bottom:10px}

/* ===== menueplan: stand, heutiger tag, ungespeicherte aenderungen ===== */
.plan-stand{margin:0 0 14px;padding:10px 14px;border-radius:10px;font-size:14.5px;line-height:1.4;
  background:#11110f0a;color:var(--muted)}
.plan-stand[data-art="gut"]{background:#2446351a;color:var(--green);font-weight:700}
.plan-stand[data-art="offen"]{background:#8c292b14;color:var(--wine);font-weight:700}
/* Der Entwurf ist weder gut noch schlecht - er ist eine Aufgabe. Gold, wie
   alles im Haus, was Aufmerksamkeit will, ohne zu alarmieren. */
.plan-stand[data-art="entwurf"]{background:#c59b5d24;color:#6b4c1d;font-weight:700}

/* Der heutige Tag ist markiert: der Wirt sieht beim Hinschauen, was gerade
   auf dem Teller liegt - ohne im Kalender nachzuzaehlen. */
.plan-tag-heute>h3{color:var(--green)}
.plan-heute{display:inline-flex;align-items:center;margin-left:8px;padding:2px 9px;border-radius:999px;
  background:var(--green);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em}
.plan-tag-heute{position:relative}
.plan-tag-heute::before{content:"";position:absolute;left:-12px;top:2px;bottom:2px;width:3px;
  border-radius:2px;background:var(--green)}

/* Die mitlaufende Leiste. Sie deckt nichts zu, was man zum Tippen braucht:
   sie sitzt unten und ist so hoch wie ein Knopf. */
.plan-leiste{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;
  align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:12px max(18px,4vw) calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper);box-shadow:0 -8px 24px #11110f26}
.plan-offen .plan-leiste{display:flex}
.plan-leiste p{margin:0;font-size:14.5px;line-height:1.35}
.plan-leiste .knopf{background:var(--paper);border-color:var(--paper);color:var(--ink);flex:0 0 auto}
.plan-leiste-kurz{display:none}
/* Am Telefon eine Zeile statt drei: mit dem langen Satz war die Leiste
   125 Pixel hoch - ein Siebtel des Bildschirms, dauerhaft. */
@media(max-width:600px){
  .plan-leiste{flex-wrap:nowrap;gap:10px;padding-top:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
  .plan-leiste p{font-size:13.5px}
  .plan-leiste .knopf{min-height:44px;padding:0 14px;font-size:13.5px}
  .plan-leiste-lang{display:none}
  .plan-leiste-kurz{display:inline}
}
/* Der letzte Kasten braucht Luft, sonst liegt die Leiste darauf. */
.plan-offen main{padding-bottom:120px}

/* 16 px ist die Grenze, unter der iOS beim Antippen in das Feld zoomt und
   die Seite verrutscht. Betrifft die beiden Uebergangs-Kaesten, die im
   Standard ausgeblendet sind - wer sie einschaltet, soll trotzdem kein
   springendes Bild bekommen. */
.werkzeug textarea,
.werkzeug input[type="file"]{font-size:16px}

/* ---- Die drei Reiter unten ------------------------------------------------
   Am unteren Rand, weil dort der Daumen liegt: der Wirt hat im Mittag eine
   Hand frei. Woerter statt Sinnbildern - die Wirtschaft-CI kennt keinen
   Symbolsatz, und drei kurze Woerter sind eindeutiger als drei gezeichnete
   Zeichen.

   Die Hoehe steht als Wert hier oben, weil drei Dinge sie brauchen: die
   Leiste selbst, der Abstand unter dem Inhalt und die Veroeffentlichen-
   Leiste, die genau darueber einrastet. */
:root{--reiter-hoehe:58px}

/* Ein Abschnitt, den die Reiter wegnehmen, wird per hidden ausgeblendet.
   Das reicht allein nicht: wer eine eigene Darstellungsart mitbringt
   (.zahlen ist ein Raster), sticht die eingebaute hidden-Regel des Browsers
   aus - die drei Zahlen des Mittags standen dadurch in JEDEM Reiter. */
[hidden]{display:none !important}

.reiter-leiste{position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;align-items:stretch;
  height:calc(var(--reiter-hoehe) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  border-top:1px solid var(--linie);background:#fff}
.reiter-knopf{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--muted);
  font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:lowercase}
/* Der offene Reiter traegt einen Strich oben - kein Farbfeld, das die
   ruhige Flaeche zerschneiden wuerde. */
.reiter-knopf::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:transparent}
.reiter-knopf[aria-selected="true"]{color:var(--green)}
.reiter-knopf[aria-selected="true"]::before{background:var(--green)}
.reiter-zahl{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;
  padding:0 6px;border-radius:999px;background:var(--wine);color:#fff;
  font-size:12px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.reiter-zahl[hidden]{display:none}

/* Platz unter dem Inhalt, damit die Leiste nichts verdeckt. */
main{padding-bottom:calc(var(--reiter-hoehe) + 34px + env(safe-area-inset-bottom,0px))}

/* Die Veroeffentlichen-Leiste rastet ueber den Reitern ein, statt sie zu
   verdecken: sonst waere entweder der Hinweis weg oder der Weg zurueck. */
.plan-leiste{bottom:calc(var(--reiter-hoehe) + env(safe-area-inset-bottom,0px));z-index:45}
@media(max-width:560px){
  .plan-leiste{padding-bottom:9px}
}

/* Am Laptop keine Leiste ueber die ganze Breite: sie schwebt als Insel in
   der Mitte, wie der Inhalt darueber. */
@media(min-width:700px){
  .reiter-leiste{left:50%;right:auto;transform:translateX(-50%);bottom:18px;
    width:min(420px,calc(100% - 36px));height:var(--reiter-hoehe);padding-bottom:0;
    border:1px solid var(--linie);border-radius:999px;box-shadow:0 6px 24px #11110f1f}
  .reiter-knopf:first-child{border-radius:999px 0 0 999px}
  .reiter-knopf:last-child{border-radius:0 999px 999px 0}
  .reiter-knopf::before{top:8px;bottom:8px;left:auto;right:auto;width:0;height:auto}
  .reiter-knopf[aria-selected="true"]::before{background:transparent}
  .reiter-knopf[aria-selected="true"]{background:var(--green);color:#fff}
  /* Weinrot auf Gruen liest sich nicht - im offenen Reiter dreht die Zahl um. */
  .reiter-knopf[aria-selected="true"] .reiter-zahl{background:#fff;color:var(--green)}
  .plan-leiste{bottom:calc(var(--reiter-hoehe) + 36px)}
}

/* ---- Anmelden -------------------------------------------------------------
   Der Regelfall auf dem Homescreen: iOS gibt einer installierten App einen
   eigenen Speicher, der Schluessel aus dem Link liegt in Safari. Einmal
   einfuegen - danach merkt sich die App ihn. */
.anmelden{border-top:0}
.anmelde-form{display:grid;gap:10px;max-width:420px;margin:0 0 6px}
.anmelde-form label{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:lowercase}
.anmelde-form input{min-height:48px;padding:0 12px;border:1px solid var(--linie);border-radius:10px;background:#fff;font-size:16px}
body.ohne-schluessel #wirtBloecke,
body.ohne-schluessel .reiter-leiste,
body.ohne-schluessel .fuss,
body.ohne-schluessel #tagZeile{display:none}
body.ohne-schluessel main{padding-bottom:64px}

/* Die Einstellungen zeigen, zu welchem Reiter ein Abschnitt gehoert -
   sonst setzt man einen Haken und findet den Kasten trotzdem nicht. */
.ansicht-reiter{margin:16px 0 6px;color:var(--green);font-size:12.5px;font-weight:700;
  letter-spacing:.16em;text-transform:lowercase}
.ansicht-reiter:first-child{margin-top:0}

/* ---- Tagesleiste ------------------------------------------------------------
   heute und die naechsten offenen Tage. Gefuellt ist nur der gewaehlte. */
.tage{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tag-chip{min-height:40px;padding:0 14px;border:1px solid var(--linie);border-radius:999px;background:#fff;
  color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:lowercase}
.tag-chip[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}
/* heute, aber zu (Wochenende, Feiertag): gestrichelt - man darf schauen,
   es passiert dort nur nichts. */
.tag-chip[data-zu]{border-style:dashed}

/* ---- Wischen zum Abhaken ----------------------------------------------------
   Die Zeile faehrt mit dem Finger nach rechts; links erscheint ein Haken,
   der mit dem Weg kraeftiger wird. Ab der Schwelle loest die Zeile ihren
   Hauptknopf aus. touch-action pan-y: senkrecht bleibt Scrollen, waagrecht
   gehoert uns. */
.haus-liste li{position:relative;touch-action:pan-y;transform:translateX(var(--wisch,0px));
  transition:transform .18s ease-out}
.haus-liste li[data-wischt]{transition:none;user-select:none;-webkit-user-select:none}
.haus-liste li::before{content:"\2713";position:absolute;left:-38px;top:50%;transform:translateY(-50%);
  width:28px;text-align:center;color:var(--green);font-size:20px;font-weight:700;
  opacity:var(--wisch-anteil,0);pointer-events:none}
.haus-liste li[data-erledigt-wisch]{transform:translateX(24px);opacity:.6}

/* ---- Vorschau der Karte -----------------------------------------------------
   Die Faltkarte im Reiter "karte": die Seite verkleinert sich selbst auf die
   Breite, der Rest scrollt im Rahmen. */
.plan-vorschau{margin:16px 0 0;padding:0}
.plan-vorschau summary{min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:700;cursor:pointer}
.plan-vorschau iframe{display:block;width:100%;height:min(70vh,640px);margin-top:8px;border:1px solid var(--linie);
  border-radius:10px;background:#e9e6df}

  </style>
</head>
<body class="uebersicht-seite zahlen-seite">
  <header class="kopf">
