  <style>
/* Gaestebildschirm am Eingang. Wirtschaft-CI: Paper, Ink, Green, Gold;
   Georgia fuer Grosses, Inter fuer alles andere. Aus drei Metern lesbar -
   deshalb sind die Groessen bewusst grob und die Elemente wenige. */

@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/inter-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/inter-latin-700-normal.woff2") format("woff2")}

:root{
  --ink:#11110f;--paper:#f3efe6;--cream:#ead9bc;--wine:#8c292b;--green:#244635;--gold:#c59b5d;
  --line:#11110f26;--muted:#57524a;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
*,*:before,*:after{box-shadow:none!important}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans)}

.sc-head{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding:24px clamp(20px,3vw,44px);border-bottom:1px solid var(--line)}
.sc-head img{display:block;width:clamp(150px,13vw,210px);height:auto}
.sc-when{display:flex;align-items:baseline;gap:18px}
.sc-clock{font-family:var(--serif);font-size:clamp(38px,4.4vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.sc-count{color:var(--muted);font-size:clamp(13px,1.1vw,17px);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

.sc-main{display:grid;gap:clamp(20px,2.4vw,40px);padding:clamp(20px,2.6vw,44px);
  grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.sc-main{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}

.sc-title{margin:0 0 18px;font-family:var(--serif);font-size:clamp(30px,3.2vw,52px);font-weight:400;letter-spacing:-.03em}
.sc-list{display:grid;gap:8px}
.sc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;
  padding:14px clamp(14px,1.4vw,22px);border:1px solid var(--line);border-radius:10px;background:#fff}
.sc-row b{font-family:var(--serif);font-size:clamp(21px,2.1vw,34px);font-weight:400;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-row em{color:var(--muted);font-size:clamp(11px,.95vw,15px);font-style:normal;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase}
.sc-table{min-width:clamp(52px,4.4vw,78px);padding:6px 14px;border-radius:999px;
  background:var(--green);color:#fff;font-size:clamp(20px,2vw,32px);font-weight:700;
  font-variant-numeric:tabular-nums;text-align:center}
.sc-empty{margin:0;padding:22px;border-left:3px solid var(--gold);background:#c59b5d1a;
  color:var(--muted);font-size:clamp(16px,1.5vw,24px);line-height:1.5}

.sc-plan{padding:clamp(14px,1.4vw,24px);border:1px solid var(--line);border-radius:12px;background:#fff}
.sc-plan .fp-svg{max-width:100%}
.sc-plan .fp-list{display:none}
.sc-plan .fp-legend,.sc-plan .fp-status{color:var(--muted)}

.sc-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:16px clamp(20px,3vw,44px);border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.sc-foot button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:inherit;font:inherit;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.sc-foot button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sc-foot .sc-tools{display:flex;gap:10px;flex-wrap:wrap}

@media(max-width:760px){
  .sc-head{padding:16px 18px}
  .sc-main{padding:18px}
  .sc-row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .sc-row em{grid-column:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Hinweis, wenn der Draht zum Dienst abreisst. Der Schirm zeigt dann weiter
   den letzten Stand - aber er sagt, dass er alt sein koennte. Eine still
   veraltete Anzeige am Eingang schickt Gaeste an falsche Tische. */
.sc-link{margin:0;padding:10px 24px;background:#8c292b;color:#fff;font-size:15px;font-weight:700;text-align:center}

/* Fertige Abholungen am Eingang, wie die Nummerntafel beim Baecker. Gross
   genug, um sie im Vorbeigehen zu lesen - der Gast steht nicht davor,
   sondern kommt zur Tuer herein. */
/* Abholbereit steht oben und ist gross: dieser Bildschirm haengt im Eingang,
   und die Nummer muss aus ein paar Metern lesbar sein - sonst ersetzt sie
   keine Nachricht aufs Telefon, sondern verlangt, dass man hingeht und liest.
   Gruen gefuellt, derselbe Ton wie die Leiste auf der Gaesteseite: wer dort
   "Abholbereit" gesehen hat, erkennt es hier wieder. */
.sc-abholung{grid-column:1/-1;margin-bottom:clamp(20px,3.5vh,40px);padding-bottom:clamp(16px,2.5vh,30px);border-bottom:1px solid var(--linie,#11110f26)}
.sc-abhol-liste{display:flex;flex-wrap:wrap;gap:clamp(10px,1.4vw,18px)}
.sc-abhol{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0;padding:clamp(10px,1.4vh,18px) clamp(18px,2.2vw,30px);border-radius:14px;background:var(--green,#244635);color:#fff;min-width:clamp(96px,9vw,150px)}
.sc-abhol b{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(52px,6.4vw,104px);line-height:.95;font-variant-numeric:tabular-nums}
.sc-abhol span{font-size:clamp(16px,1.7vw,24px);line-height:1.2;opacity:.9}

/* Tischplan. Nutzt ausschliesslich die bestehenden CI-Tokens; die Fallbacks
   machen die Datei auch im Gastgeber-Cockpit einsetzbar, das eigene Variablen
   mitbringt. Keine Verlaeufe, keine Schatten, keine Icon-Sets. */

/* Das hidden-Attribut muss jede display-Regel schlagen. Ohne diese Zeile
   gewinnt die spezifischere Klasse: .fp-tab-badge{display:inline-flex} zeigte
   das Abzeichen auch bei null Ueberfaelligen - im Reiter stand dauerhaft eine
   "0" -, und .add-service{display:grid} liess das Formular "Etage raeumen"
   stehen, obwohl der Code es bei nur einer Etage ausblendet. */
[hidden]{display:none!important}

.fp{display:grid;gap:20px}
.fp-levels{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.fp-levels button{min-height:48px;padding:0 16px;border:1px solid #11110f3d;border-radius:999px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:var(--t-body,17.5px);cursor:pointer}
.fp-levels button[aria-checked="true"]{border-color:var(--green,#244635);background:var(--green,#244635);color:#fff}

.fp-stage{display:grid;gap:20px}
/* Direkteingabe auf dem Tisch. Liegt als foreignObject im SVG, damit sie ohne
   Inline-Stile auskommt - die Content-Security-Policy verbietet die.
   Die Masse sind Rastereinheiten, nicht Pixel. */
.fp-inline{box-sizing:border-box;width:100%;height:100%;padding:0 .12px;border:.08px solid var(--green,#244635);border-radius:.12px;background:#fff;color:var(--ink,#11110f);font-family:var(--sans,Inter,system-ui,sans-serif);font-size:.7px;font-weight:700;text-align:center}
.fp-inline:focus{outline:.12px solid var(--gold,#c59b5d);outline-offset:.06px}
@media(min-width:901px){.fp-stage{grid-template-columns:minmax(0,560px) minmax(240px,1fr);align-items:start}}

.fp-svg{display:block;width:100%;max-width:480px;height:auto}
.fp-svg .fp-shape{fill:#fff;stroke:#11110f40;stroke-width:1;vector-effect:non-scaling-stroke}
/* Stuehle: so viele wie Plaetze. Sie machen die Tischgroesse auf einen Blick
   lesbar, ohne dass man die Zahl lesen muss. */
.fp-svg .fp-chair{fill:#11110f1f;stroke:none}
.fp-svg .fp-chair.is-named{fill:var(--green,#244635);opacity:.7}
.fp-svg .fp-seat-name{fill:#3c3833;font-family:var(--sans,Inter,system-ui,sans-serif);font-size:.46px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.fp-seatmode .fp-seat{cursor:text}

/* Raumobjekte: Buehne, Bar, Eingang, Terrasse und Waende. Sie liegen unter
   den Tischen und dienen der Orientierung, nicht der Sperre. */
.fp-svg .fp-element-shape{fill:#11110f0a;stroke:#11110f33;stroke-width:1;vector-effect:non-scaling-stroke}
.fp-svg [data-kind="wand"] .fp-element-shape{fill:#11110f66;stroke:none}
.fp-svg [data-kind="buehne"] .fp-element-shape{fill:#8c292b14;stroke:#8c292b59}
.fp-svg [data-kind="bar"] .fp-element-shape{fill:#c59b5d24;stroke:#c59b5d80}
.fp-svg [data-kind="terrasse"] .fp-element-shape{fill:#2446351a;stroke:#24463559;stroke-dasharray:.3 .2}
.fp-svg .fp-element-label{fill:#57524a;font-family:var(--sans,Inter,system-ui,sans-serif);font-size:.62px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;text-anchor:middle;dominant-baseline:central}
.fp-svg [data-state="picked"] .fp-chair{fill:var(--green,#244635);opacity:.55}
.fp-svg [data-state="busy"] .fp-chair{fill:#11110f38}
.fp-svg [data-state="blocked"] .fp-chair{fill:#8c292b40}
/* Schriftgroesse in Rastereinheiten: bei 480 px Deckel rund 20 px, auf 390 px
   Breite rund 14 px. In beiden Faellen lesbar, ohne den Plan zu dominieren. */
.fp-svg .fp-num{fill:var(--ink,#11110f);font-family:var(--sans,Inter,system-ui,sans-serif);font-size:1px;font-weight:700;font-variant-numeric:tabular-nums;text-anchor:middle;dominant-baseline:central}
/* Personenzahl abgekuerzt, z. B. 3P. Bewusst kleiner als die Tischnummer:
   die Nummer ist die Identitaet, die Groesse die Zusatzinfo. */
.fp-svg .fp-seats{fill:#57524a;font-family:var(--sans,Inter,system-ui,sans-serif);font-size:.72px;font-weight:700;letter-spacing:.04em;text-anchor:middle;dominant-baseline:central}
.fp-svg .fp-name{fill:var(--ink,#11110f);font-family:var(--sans,Inter,system-ui,sans-serif);font-size:.62px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.fp-svg .fp-name.is-narrow{font-size:.5px}
.fp-svg [data-state="picked"] .fp-name{fill:#fff}
.fp-svg [data-state="picked"] .fp-seats{fill:#ffffffcc}
.fp-svg [data-state="blocked"] .fp-seats{fill:var(--wine,#8c292b)}
.fp-movable [data-table-id]{cursor:grab}
.fp-movable [data-table-id].is-dragging{cursor:grabbing}
.fp-movable [data-table-id].is-dragging .fp-shape{stroke:var(--green,#244635);stroke-dasharray:.35 .25}
.fp-svg [data-state="busy"] .fp-shape{fill:var(--cream,#ead9bc)}
.fp-svg [data-state="busy"] .fp-num{fill:#57524a}
.fp-svg [data-state="blocked"] .fp-shape{stroke:var(--wine,#8c292b)}
.fp-svg [data-state="blocked"] .fp-num{fill:var(--wine,#8c292b)}
.fp-svg [data-state="picked"] .fp-shape{fill:var(--green,#244635);stroke:var(--green,#244635)}
.fp-svg [data-state="picked"] .fp-num{fill:#fff}
/* Ueberfaellig: die Zeit laeuft, aber niemand hat eingecheckt. Gold ist der
   auffaellige Ton des bestehenden CI - kein neuer Farbwert. Auf Gold hat Ink
   ein Kontrastverhaeltnis von 7,5:1, die Beschriftung bleibt also lesbar. */
.fp-svg [data-state="late"] .fp-shape{fill:var(--gold,#c59b5d);stroke:#a67f45}
.fp-svg [data-state="late"] .fp-num,.fp-svg [data-state="late"] .fp-name{fill:var(--ink,#11110f)}
.fp-svg [data-state="late"] .fp-seats{fill:#3c2f18}
.fp-svg [data-state="late"] .fp-chair{fill:#a67f4599}
.fp-svg .fp-mark{fill:#57524a;font-family:var(--sans,Inter,system-ui,sans-serif);font-size:.85px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

.fp-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.fp-list li{display:flex;align-items:center;min-height:32px;color:#57524a;font-size:var(--t-meta,14.5px);line-height:1.45}
.fp-list b{margin-right:8px;color:var(--ink,#11110f);font-variant-numeric:tabular-nums}
.fp-list button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 12px;border:1px solid #11110f26;border-radius:8px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:var(--t-meta,14.5px);text-align:left;cursor:pointer}
.fp-list button[aria-checked="true"]{border-color:var(--green,#244635);background:var(--green,#244635);color:#fff}
.fp-list button[disabled]{background:var(--cream,#ead9bc);color:#57524a;cursor:not-allowed}
.fp-list button:focus-visible,.fp-levels button:focus-visible{outline:3px solid var(--gold,#c59b5d);outline-offset:3px}

.fp-legend{display:flex;flex-wrap:wrap;gap:14px;margin:0;color:#57524a;font-size:var(--t-label,12.5px);letter-spacing:.06em;text-transform:uppercase}
.fp-legend span{display:inline-flex;align-items:center;gap:6px}
.fp-legend i{width:12px;height:12px;border:1px solid #11110f40;background:#fff}
.fp-legend i.busy{background:var(--cream,#ead9bc)}
.fp-legend i.late{border-color:#a67f45;background:var(--gold,#c59b5d)}
.fp-legend i.blocked{border-color:var(--wine,#8c292b)}

/* Bis wann belegt, bis wann frei. Steht in der Tischzeile und in der
   Reservierungszeile - die Frage an der Tuer lautet nie "ist frei", sondern
   "ist frei bis wann". */
.fp-until{padding:2px 8px;border:1px solid var(--line,#11110f26);border-radius:99px;color:#57524a;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fp-until.is-late{border-color:#a67f45;background:var(--gold,#c59b5d);color:var(--ink,#11110f)}
.fp-until.is-here{border-color:var(--green,#244635);background:#e8f0ea;color:var(--green,#244635)}

/* Filter und Suche ueber der Tischliste. Bei 25 und mehr Tischen ist die
   ungefilterte Liste im Betrieb nicht mehr lesbar. */
.fp-filter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.fp-filter button{min-height:44px;padding:0 14px;border:1px solid #11110f3d;border-radius:999px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:13px;cursor:pointer}
.fp-filter button[aria-pressed="true"]{border-color:var(--green,#244635);background:var(--green,#244635);color:#fff}
.fp-filter input{flex:1 1 180px;min-width:140px;min-height:44px;padding:0 12px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#fff;color:inherit;font:inherit;font-size:13px}
.fp-filter button:focus-visible,.fp-filter input:focus-visible{outline:3px solid var(--gold,#c59b5d);outline-offset:2px}

.fp-status{margin:0;color:#57524a;font-size:var(--t-meta,14.5px);line-height:1.5}
.fp-empty{margin:0;color:#57524a;font-size:var(--t-meta,14.5px);line-height:1.5}

/* Nur in der internen Tischplanansicht sichtbar. Der Fliesstext darf nicht in
   die Versalien-Regel fuer .welcome p fallen - so ist er nicht lesbar. */
.welcome p.fp-intro{max-width:64ch;margin-top:14px;color:var(--muted,#6d675f);font-size:13px;font-weight:400;letter-spacing:0;line-height:1.6;text-transform:none}
.fp-levels-editor{display:grid;gap:10px;margin-bottom:16px}
.fp-level-row{display:flex;flex-wrap:wrap;align-items:end;gap:12px}
.fp-level-row label{display:grid;gap:6px;font-size:var(--t-label,12.5px);font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.fp-level-row input{min-height:44px;padding:8px 12px;border:1px solid #11110f3d;border-radius:8px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:var(--t-body,17.5px);letter-spacing:0;text-transform:none}
.fp-level-name input{min-width:200px}
.fp-sizes{display:flex;flex-wrap:wrap;gap:8px}
.fp-sizes label{display:grid;gap:4px;justify-items:center;font-size:var(--t-label,12.5px);font-weight:700;letter-spacing:.06em}
.fp-sizes input{width:62px;text-align:center;font-variant-numeric:tabular-nums}
.fp-warn{margin:0 0 16px;padding:12px 16px;border-left:2px solid var(--wine,#8c292b);background:#8c292b14;color:#6b2224;font-size:var(--t-meta,14.5px);line-height:1.5;max-width:64ch}
.fp-tools{display:grid;gap:12px;margin-top:20px}
.fp-result{margin:0;padding:12px 16px;border-left:2px solid var(--green,#244635);background:#11110f0a;color:#3c3833;font-size:var(--t-meta,14.5px);line-height:1.55;max-width:64ch}.fp-result:empty{display:none}

/* Belegung: offene Gruppen oben, Einzelzuweisung unten. */
.fp-party-list{display:grid;gap:6px;margin:16px 0 0;padding:0;list-style:none}
.fp-party-list li{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#fff;font-size:12px}
.fp-party-list li.is-marked{border-color:var(--green,#244635);border-width:2px;background:#e8f0ea}
/* Die Gruppe selbst ist der Knopf: markieren, dann Tisch anklicken. */
.fp-party-list .pick{display:flex;flex:1 1 auto;align-items:center;gap:10px;min-height:40px;padding:0;border:0;background:none;color:inherit;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.fp-party-list .pick[aria-pressed="true"] .open{color:var(--green,#244635)}
.fp-party-list b{font-size:13px}
.fp-party-list .seat{color:var(--muted,#6d675f);font-variant-numeric:tabular-nums}
.fp-party-list .at{margin-left:auto;padding:2px 8px;border-radius:99px;background:#e8f0ea;color:var(--green,#244635);font-weight:700;font-variant-numeric:tabular-nums}
.fp-party-list .open{margin-left:auto;color:var(--wine,#8c292b);font-weight:700}
/* 44 px Tapziel - dieselbe Untergrenze wie auf den Gaesteseiten. */
.fp-party-list button{min-height:44px;padding:0 12px;border:1px solid var(--line,#11110f26);border-radius:7px;background:transparent;color:inherit;font:inherit;font-size:11px;cursor:pointer}
.fp-party-list .pick{min-height:44px}
.fp-empty-list{margin:16px 0 0;color:var(--muted,#6d675f);font-size:12px}
/* Tischliste: eine Zeile je Tisch, Name und Personen direkt editierbar. */
.fp-tables{display:grid;gap:6px;margin-top:16px}
.fp-table-row{display:grid;grid-template-columns:64px minmax(140px,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#fff}
.fp-row-actions{display:flex;align-items:center;gap:8px}
.fp-row-actions input{width:74px}
.fp-row-actions select{min-height:38px;max-width:180px;padding:0 8px;border:1px solid var(--line,#11110f26);border-radius:6px;background:#fff;color:inherit;font:inherit;font-size:12px;cursor:pointer}
.fp-table-row.is-busy{background:#f6f1e6}
/* Ueberfaellig: Zeit laeuft, niemand eingecheckt. Gleiche Sprache wie auf der
   Karte, damit Liste und Plan nicht verschiedene Dinge behaupten. */
.fp-table-row.is-late{border-color:#a67f45;background:#f6ecd9}
.fp-table-row.is-blocked{border-color:var(--wine,#8c292b)}
.fp-table-row.is-picked{border-color:var(--green,#244635);border-width:2px}
.fp-table-row .no{font-weight:800;font-variant-numeric:tabular-nums}
.fp-table-row .no small{display:block;color:var(--muted,#6d675f);font-size:10px;font-weight:600}
.fp-table-row input{min-height:38px;padding:0 10px;border:1px solid var(--line,#11110f26);border-radius:6px;background:#fff;color:inherit;font:inherit;font-size:13px}
.fp-table-row input[type="number"]{text-align:center;font-variant-numeric:tabular-nums}
.fp-table-row input:disabled{background:#f2efe9;color:var(--muted,#6d675f)}
.fp-table-row button{min-height:38px;padding:0 10px;border:1px solid var(--line,#11110f26);border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:11px;cursor:pointer}
.fp-table-row button:disabled{border-style:dashed;color:var(--muted,#6d675f);opacity:.5;cursor:not-allowed}
.fp-table-row .span{grid-column:1/-1;margin:0;color:var(--muted,#6d675f);font-size:11px}

/* Reservierungen: Uhrzeit, Name, Personen, Essenswunsch, Tisch. */
.fp-party-list .when{min-width:44px;color:var(--muted,#6d675f);font-weight:700;font-variant-numeric:tabular-nums}
.fp-party-list .dishes{color:var(--green,#244635);font-size:11px}
.fp-res-form{grid-template-columns:1.4fr .9fr .8fr .7fr auto}
.fp-dishes{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:0 0 12px;padding:12px 16px;border:1px dashed var(--line,#11110f26);border-radius:10px;background:#fff}
.fp-dishes legend{padding:0 6px;color:var(--muted,#6d675f);font-size:11px}
.fp-dishes label{display:grid;gap:6px;font-size:var(--t-label,12.5px);font-weight:700;letter-spacing:.06em}
.fp-dishes input{width:74px;min-height:38px;padding:0 8px;border:1px solid var(--line,#11110f26);border-radius:6px;background:#fff;color:inherit;font:inherit;text-align:center;font-variant-numeric:tabular-nums}
.fp-kitchen{margin:12px 0 0;padding:12px 16px;border-left:2px solid var(--gold,#c59b5d);background:#c59b5d14;color:#3c3833;font-size:12px;line-height:1.55}

/* Tische und Stuehle je Etage. */
.fp-level-block{padding:14px;border:1px solid var(--line,#11110f26);border-radius:10px;background:#fff}
.fp-sizes button{min-height:38px;padding:0 10px;border:1px solid var(--line,#11110f26);border-radius:7px;background:transparent;color:inherit;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.fp-chairs-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fp-chair-chip{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line,#11110f26);border-radius:99px;font-size:11px}
.fp-chair-chip b{font-variant-numeric:tabular-nums}
.fp-chair-chip span{color:var(--muted,#6d675f)}
.fp-chair-chip button{min-width:34px;min-height:34px;border:1px solid var(--line,#11110f26);border-radius:99px;background:transparent;color:inherit;font:inherit;font-size:12px;cursor:pointer}
.fp-chair-chip button:disabled{opacity:.35;cursor:not-allowed}

.fp-subhead{margin:26px 0 12px;font-family:Georgia,serif;font-size:21px;font-weight:400}
.fp-subhead:first-of-type{margin-top:0}
.fp-seat-form{margin-top:16px}
.fp-selected{margin:0 0 12px;font-family:Georgia,serif;font-size:20px}
.fp-selected small{display:block;margin-top:4px;font-family:inherit;font-size:11px;color:var(--muted,#6d675f)}

@media(max-width:900px){
  .fp-svg{max-width:100%}
  .fp-levels button{flex:1 1 calc(50% - 4px);min-height:52px}
}
@media(max-width:760px){
  .fp-table-row{grid-template-columns:56px 1fr;row-gap:8px}
  .fp-row-actions{grid-column:2;flex-wrap:wrap}
  .fp-row-actions button{flex:1 1 auto;min-height:44px}
  .fp-row-actions input,.fp-row-actions select{min-height:44px}
  .fp-table-row input{min-height:44px}
  .fp-res-form{grid-template-columns:1fr}
  .fp-chair-chip button{min-width:44px;min-height:44px}
  .fp-sizes button{min-height:44px}
  .fp-dishes input{min-height:44px}
}
@media(prefers-reduced-motion:reduce){.fp *{transition:none!important;animation:none!important}}

/* Tagesuebersicht: der gewaehlte Tag steht oben und ist hervorgehoben. */
#fpStats .is-today td{background:#e8f0ea;font-weight:700}

/* Druck und PDF: nur der Plan, quer, ohne Bedienelemente. Die Auswahlfelder
   muessen ausdruecklich mit weg - sie sind keine Knoepfe und blieben sonst als
   "Tisch wechseln ..." auf dem Serviceblatt stehen. */
@media print{
  @page{size:landscape;margin:12mm}
  .topbar,.fp-tools,.fp-levels-editor,.fp-party-list button,.fp-party-list select,
  .add-service,.fp-filter,.fp-dishes,.fp-table-row .fp-row-actions,
  .notice,.model-note,#fpStats,.fp-warn,.fp-chairs-list,.fp-sizes,
  .fp-tabs,.fp-quick,.fp-bar-when{display:none!important}
  /* Der Moment gehoert aufs Blatt, die Bedienung nicht. */
  .fp-bar{position:static;border:0;padding:0}
  .fp-stat{border:0;padding:0 10px 0 0}
  /* Zugeklappte Bereiche gehoeren auch im Druck nicht aufs Blatt. */
  details:not([open]) > *:not(summary){display:none!important}
  summary{display:none!important}
  body{background:#fff}
  .panel{page-break-inside:avoid;border:0;padding:0;background:none;box-shadow:none}
  .fp-svg{max-width:100%}
  .fp-list,.fp-stage{grid-template-columns:1fr}
  .welcome h1{font-size:28px}
  .fp-intro{display:none}
}

/* Kundenansicht: Namensliste je Tisch. */
.kp-names{display:grid;gap:12px}
.kp-table{padding:12px 14px;border:1px solid var(--line,#11110f26);border-radius:10px;background:#fff}
.kp-table b{display:block;margin-bottom:8px;font-size:13px}
.kp-seats{display:flex;flex-wrap:wrap;gap:10px}
.kp-seats label{display:grid;gap:5px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#6d675f)}
.kp-seats input{width:150px;min-height:44px;padding:0 10px;border:1px solid var(--line,#11110f26);border-radius:7px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:13px;letter-spacing:0;text-transform:none}
.kp-print-head{display:none}
@media print{
  .kp-print-head{display:block;margin:0 0 14px;font-family:Georgia,serif;font-size:22px;font-weight:400}
  .kp-names,.welcome,.fp-result{display:none!important}
}

/* ---- Servicezeile ---------------------------------------------------------
   Klebt oben, weil sie im Betrieb die einzige Zeile ist, die man staendig
   braucht. Formen und Farben aus den vorhandenen Komponenten. */
/* Servicezeile und Reiter kleben gemeinsam. Zwei getrennte klebende Ebenen
   braeuchten eine geratene Hoehe fuer die zweite - die bricht, sobald die
   erste Zeile umbricht. */
.fp-sticky{position:sticky;top:0;z-index:30;background:var(--paper,#f3efe6)}
.fp-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:0;padding:10px 0;border-bottom:1px solid var(--line,#11110f26)}
.fp-bar-when{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin:0}
.fp-bar-field{display:grid;gap:4px;font-size:var(--t-label,12.5px);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted,#6d675f)}
.fp-bar-field input{min-height:44px;padding:0 10px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:14px;letter-spacing:0;font-variant-numeric:tabular-nums}
.fp-bar-go{min-height:44px;padding:0 16px;border:1px solid var(--ink,#11110f);border-radius:8px;background:var(--ink,#11110f);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}

/* Der Jetzt-Schalter. Gruen und mit Punkt, wenn die Uhr mitlaeuft - angehalten
   ist ein Zustand, den man sofort sehen muss. */
.fp-live{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid #11110f3d;border-radius:999px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.fp-live i{width:9px;height:9px;border-radius:50%;background:#b3ada2}
.fp-live[aria-pressed="true"]{border-color:var(--green,#244635);background:var(--green,#244635);color:#fff}
.fp-live[aria-pressed="true"] i{background:#8fd6a8}
.fp-live:focus-visible,.fp-bar-go:focus-visible,.fp-bar-field input:focus-visible{outline:3px solid var(--gold,#c59b5d);outline-offset:2px}

/* Richtzeit-Haekchen. Aus ist ein Zustand, den man sehen muss - sonst wundert
   sich abends jemand, warum kein Tisch frei geworden ist. */
.fp-toggle{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 14px;border:1px solid #11110f3d;border-radius:999px;background:#fff;cursor:pointer}
.fp-toggle input{width:18px;height:18px;accent-color:var(--green,#244635);cursor:pointer}
.fp-toggle span{display:grid;font-size:13px;font-weight:700;line-height:1.2}
.fp-toggle b{color:var(--muted,#6d675f);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.fp-toggle.is-off{border-color:#a67f45;background:#f6ecd9}
.fp-toggle.is-off b{color:#6b4f1f}
.fp-toggle:focus-within{outline:3px solid var(--gold,#c59b5d);outline-offset:2px}

/* Mengeneingabe je Tischgroesse: "8 Zweier, 6 Vierer" statt 25 Einzelklicks. */
.fp-counts label{gap:5px;color:var(--muted,#6d675f)}
.fp-counts input{width:56px;min-height:44px;text-align:center}

/* Flexibel-Betrieb: drei Zahlen statt Einzeltische. Die Summe steht direkt
   daneben - sie ist die Stuhlzahl, nach der der Wirt fragt. */
.fp-flex-summe{align-self:center;color:var(--ink,#11110f);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fp-flex-hinweis{display:block;color:var(--muted,#6d675f);font-size:12.5px;line-height:1.5;max-width:56ch}
.fp-level-name select{min-height:44px}

.fp-bar-stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.fp-stat{display:inline-flex;align-items:baseline;gap:5px;padding:5px 11px;border:1px solid var(--line,#11110f26);border-radius:999px;background:#fff;color:#57524a;font-size:12px;white-space:nowrap}
.fp-stat b{color:var(--ink,#11110f);font-size:15px;font-variant-numeric:tabular-nums}
.fp-stat.is-late{border-color:#a67f45;background:var(--gold,#c59b5d);color:var(--ink,#11110f)}
.fp-stat.is-late b{color:var(--ink,#11110f)}
.fp-stat.is-open{border-color:var(--wine,#8c292b);color:#6b2224}
.fp-stat.is-next{background:#e8f0ea;border-color:#24463540;color:var(--green,#244635);font-weight:700}

/* ---- Reiter --------------------------------------------------------------- */
.fp-tabs{margin:0 0 22px;padding:10px 0;border-bottom:1px solid var(--line,#11110f26)}
.fp-tabs [role="tablist"]{display:flex;flex-wrap:wrap;gap:6px}
.fp-tabs [role="tab"]{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 18px;border:1px solid #11110f3d;border-radius:999px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.fp-tabs [role="tab"][aria-selected="true"]{border-color:var(--ink,#11110f);background:var(--ink,#11110f);color:#fff}
.fp-tabs [role="tab"]:focus-visible{outline:3px solid var(--gold,#c59b5d);outline-offset:3px}
.fp-tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold,#c59b5d);color:var(--ink,#11110f);font-size:11px;font-variant-numeric:tabular-nums}
.fp-tabpanel:focus{outline:none}

/* ---- Ablauf: die Sequenz -------------------------------------------------- */
.fp-flow{display:grid;gap:10px;margin:0 0 26px;padding:0;list-style:none;counter-reset:schritt}
.fp-flow li{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:14px;padding:14px 16px;border:1px solid var(--line,#11110f26);border-radius:10px;background:#fff}
.fp-flow li::before{counter-increment:schritt;content:counter(schritt);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ink,#11110f);color:#fff;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.fp-flow b{grid-column:2;font-size:15px}
.fp-flow span{grid-column:2;color:#57524a;font-size:13.5px;line-height:1.55}
.fp-flow em{font-style:normal;font-weight:700;color:var(--green,#244635)}
.fp-flow i{grid-row:1;grid-column:3;padding:3px 10px;border-radius:999px;background:#11110f0a;color:var(--muted,#6d675f);font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

.fp-colorkey{display:grid;gap:8px;margin:0 0 26px;padding:0;list-style:none}
.fp-colorkey li{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:12px;font-size:13.5px}
.fp-colorkey i{width:26px;height:26px;border:1px solid #11110f40;border-radius:3px;background:#fff}
.fp-colorkey i.k-busy{background:var(--cream,#ead9bc)}
.fp-colorkey i.k-late{border-color:#a67f45;background:var(--gold,#c59b5d)}
.fp-colorkey i.k-blocked{border-color:var(--wine,#8c292b);border-width:2px}
.fp-colorkey span{color:#57524a}
.fp-facts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.fp-facts li{padding-left:16px;border-left:2px solid var(--green,#244635);color:#57524a;font-size:13.5px;line-height:1.6}
.fp-facts b{color:var(--ink,#11110f)}
.fp-facts em{font-style:normal;font-weight:700;color:var(--green,#244635)}

/* Schnellwahl der Personenzahl: Tippen kostet an der Tuer mehr Zeit als es
   aussieht. */
.fp-quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.fp-quick button{min-width:52px;min-height:44px;padding:0 12px;border:1px solid #11110f3d;border-radius:999px;background:#fff;color:var(--ink,#11110f);font:inherit;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.fp-quick button[aria-pressed="true"]{border-color:var(--green,#244635);background:var(--green,#244635);color:#fff}
.fp-quick button:focus-visible{outline:3px solid var(--gold,#c59b5d);outline-offset:2px}

/* Der Arbeitsbereich im Betrieb: Karte und Reservierungen. Untereinander lagen
   sie rund 3300 Pixel auseinander, obwohl man im Service staendig zwischen
   ihnen wechselt. Ab 1200 Pixel stehen sie nebeneinander; darin stapelt die
   Karte ihre eigene Zweiteilung, sonst wird der Plan zu schmal. */
@media(min-width:1200px){
  .fp-work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .fp-work .fp-stage{grid-template-columns:1fr}
  .fp-work > .panel{margin:0}
}

/* Zusammenklappbare Bereiche: Einrichtung fasst man einmal an, im Betrieb ist
   sie nur Weg. Aussehen aus den vorhandenen Komponenten, keine neuen Formen. */
.fp-fold{margin-top:20px;border-top:1px solid var(--line,#11110f26)}
.fp-fold > summary{display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 0;color:var(--ink,#11110f);font-size:var(--t-label,12.5px);font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;list-style:none}
.fp-fold > summary::-webkit-details-marker{display:none}
.fp-fold > summary::before{content:"+";display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid #11110f3d;border-radius:50%;font-size:14px;line-height:1}
.fp-fold[open] > summary::before{content:"–"}
.fp-fold > summary:focus-visible{outline:3px solid var(--gold,#c59b5d);outline-offset:3px}

/* Handy und Tablet: der Plan wird kleiner und ruhiger, die Listen schmaler. */
@media(max-width:1024px){
  .fp-svg{max-width:100%}
  .fp-stage{grid-template-columns:1fr}
}
@media(max-width:760px){
  main{padding-top:22px}
  .panel{padding:14px}
  .panel-head h2{font-size:26px}
  .welcome h1{font-size:clamp(34px,9vw,48px)}
  .fp-svg{max-width:100%}
  .kp-seats input{width:100%;min-width:0}
  .kp-seats label{flex:1 1 100%}
  .fp-party-list li{font-size:11.5px}
  /* Die Reservierungszeile konnte am Handy nicht schmaler werden als ihr
     Inhalt: .pick ist selbst ein Flex-Element, dessen Kinder nicht umbrachen.
     Ergebnis waren 15 Pixel waagrechter Ueberlauf. */
  .fp-party-list .pick{flex-wrap:wrap;min-width:0}
  .fp-party-list .at{margin-left:0}
  .fp-party-list b{min-width:0;overflow-wrap:anywhere}
  /* Das Auswahlfeld zum Umsetzen erbte am Handy nur 18 Pixel Hoehe - mit dem
     Finger nicht zu treffen. Es bekommt eine eigene Zeile in voller Breite. */
  .fp-party-list select{flex:1 1 100%;min-width:0;min-height:44px;padding:0 10px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#fff;font:inherit;font-size:12.5px}
  /* Die Tischzeile bekam mit Form und Drehen mehr Inhalt, als in 375 Pixel
     passt - und ein Flex-Element ohne Umbruch schiebt ueber den Rand hinaus,
     statt schmaler zu werden. Dasselbe bei den Mengenfeldern: als Flex-Kind
     schrumpft ein Block ohne min-width:0 nie unter seinen Inhalt. */
  .fp-chair-chip{flex-wrap:wrap;justify-content:flex-start;border-radius:12px}
  .fp-chair-chip select{flex:1 1 100%;min-width:0}
  .fp-chair-chip button{min-height:44px}
  .fp-sizes{flex:1 1 100%;min-width:0}
  .fp-counts label{flex:0 0 auto}
  .fp-level-row{gap:10px}
  .fp-level-name input{min-width:0;width:100%}
  .fp-level-name{flex:1 1 100%}
  /* Am Handy wuerde die ganze Kopfleiste die halbe Anzeige fressen. Sie
     scrollt deshalb mit; nur die Reiter bleiben oben stehen. */
  .fp-sticky{position:static}
  .fp-tabs{position:sticky;top:0;z-index:29;background:var(--paper,#f3efe6);margin-bottom:16px}
  .fp-bar{gap:10px}
  .fp-bar-stats{margin-left:0}
  .fp-tabs [role="tab"]{padding:0 14px;font-size:13px}
  .fp-flow li{grid-template-columns:auto minmax(0,1fr);gap:10px 12px}
  .fp-flow i{grid-row:auto;grid-column:2;justify-self:start}
  .fp-party-list .dishes{flex:1 1 100%;margin-left:52px}
  .fp-chair-chip{flex:1 1 100%;justify-content:space-between}
  .table-wrap{font-size:11px}
}

/* Die Kopfleiste kommt aus gastgeber.css mit 38 px - auf dem Handy zu klein. */
@media(max-width:760px){
  .top-actions button,.top-actions a{min-height:44px}
  .top-actions{gap:6px}
}

/* Sicherung: der Knopf sieht aus wie die anderen, das Dateifeld liegt darunter. */
.fp-restore{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;
  border:1px solid var(--line,#11110f26);border-radius:8px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.fp-restore input{position:absolute;width:1px;height:1px;opacity:0}

/* Gaestehistorie. Ein Hinweis fuer den Service, kein Urteil - deshalb klein
   und neben der Zeile, nicht als Ueberschrift. */
.fp-akte{padding:2px 8px;border-radius:99px;background:#e8f0ea;color:var(--green,#244635);font-size:11px;font-weight:700;white-space:nowrap}
.fp-akte.is-warnung{background:#f6ecd9;color:#6b4f1f}
.fp-notiz{flex:1 1 100%;color:var(--muted,#6d675f);font-size:11.5px;font-style:italic}
/* Form und Drehung in der Tischzeile. */
.fp-chair-chip select{min-height:44px;padding:0 8px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#fff;font:inherit;font-size:12px}

/* Der Automatik-Schalter steht auf eigener Zeile: er ist die wichtigste
   Entscheidung in diesem Kasten und soll nicht neben einem Feld untergehen. */
.fp-toggle-block{display:inline-flex;margin:14px 0 0}

/* Raumelemente: jede Sorte klar unterscheidbar, ohne bunt zu werden. */
.fp-svg [data-kind="toilette"] .fp-element-shape{fill:#24463514;stroke:#24463566}
.fp-svg [data-kind="kueche"] .fp-element-shape{fill:#11110f14;stroke:#11110f59}
.fp-svg [data-kind="garderobe"] .fp-element-shape{fill:#c59b5d1a;stroke:#c59b5d80}
/* Eine Saeule steht wirklich im Weg - deshalb voll durchgezeichnet. */
.fp-svg [data-kind="saeule"] .fp-element-shape{fill:#11110f80;stroke:#11110f}
/* Fenster: eine Linie in der Wand, kein Block. */
.fp-svg [data-kind="fenster"] .fp-element-shape{fill:#8fb8d6;stroke:#5b87a6}
/* Wege sind gestrichelt und leer - sie sind Freiflaeche, kein Moebel. */
.fp-svg [data-kind="weg"] .fp-element-shape{fill:none;stroke:#11110f4d;stroke-dasharray:.4 .3}
.fp-svg [data-kind="weg"] .fp-element-label{fill:#8b857b}

/* Massfelder am Raumelement: Zahl und Einheit nebeneinander, damit klar ist,
   dass hier Meter stehen und keine Rasterkaestchen. */
.fp-mass{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#6d675f)}
.fp-mass input{width:64px;min-height:44px;padding:0 8px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#fff;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.fp-mass small{font-size:11px;text-transform:none}

/* Posteingang. Er ist das einzige, was von aussen hereinkommt - deshalb steht
   er oben und faellt auf, solange etwas ungelesen ist. */
.fp-inbox{border-left:3px solid var(--green,#244635)}
.fp-mail-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.fp-mail-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line,#11110f26);border-radius:10px;background:#fff}
.fp-mail-list li.is-neu{border-color:var(--green,#244635);background:#e8f0ea}
.fp-mail-list .wann{font-size:11px;font-weight:700;color:var(--muted,#6d675f);font-variant-numeric:tabular-nums;text-align:center;line-height:1.3}
.fp-mail-list .wann b{display:block;font-size:15px;color:var(--ink,#11110f)}
.fp-mail-list .was{font-size:14px;line-height:1.45}
.fp-mail-list .was b{font-size:15px}
.fp-mail-list .was em{font-style:normal;color:var(--muted,#6d675f)}
.fp-mail-list .tat{display:flex;flex-wrap:wrap;gap:8px}
.fp-mail-list button{min-height:44px;padding:0 14px;border:1px solid #11110f3d;border-radius:8px;background:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.fp-mail-list button.haupt{border-color:var(--ink,#11110f);background:var(--ink,#11110f);color:#fff}
.fp-tab-badge.is-post{background:var(--green,#244635);color:#fff}
@media(max-width:760px){
  .fp-mail-list li{grid-template-columns:auto minmax(0,1fr)}
  .fp-mail-list .tat{grid-column:1 / -1}
}

/* Geraet koppeln. Ein Link statt Abtippen - der haeufigste Grund, warum ein
   zweites Geraet nie eingerichtet wird, ist das Abtippen. */
.fp-koppeln{margin:16px 0;padding:14px 16px;border:1px solid var(--line,#11110f26);border-radius:10px;background:#fff}
.fp-koppeln b{display:block;font-size:14px}
.fp-koppeln p{margin:6px 0 12px;color:#57524a;font-size:13px;line-height:1.5;max-width:60ch}
.fp-koppeln-zeile{display:flex;flex-wrap:wrap;gap:8px}
.fp-koppeln input{flex:1 1 240px;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--line,#11110f26);border-radius:8px;background:#f7f5f0;color:#57524a;font:inherit;font-size:12.5px}
.fp-koppeln small{display:block;margin-top:10px;color:var(--muted,#6d675f);font-size:12px}

/* Startseite "Heute". Zahlen gross, Erklaerung klein - man liest sie im
   Vorbeigehen, nicht im Sitzen. */
.fp-kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.fp-kachel{padding:16px 18px;border:1px solid var(--line,#11110f26);border-radius:12px;background:#fff}
.fp-kachel b{display:block;font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.fp-kachel span{display:block;margin-top:6px;color:#57524a;font-size:13px;line-height:1.4}
.fp-kachel.is-warnung{border-color:#a67f45;background:#f6ecd9}
.fp-kachel.is-neu{border-color:var(--green,#244635);background:#e8f0ea}
.fp-kachel.is-neu b,.fp-kachel.is-warnung b{color:var(--ink,#11110f)}

.fp-zeitachse{display:grid;gap:6px;margin:0 0 26px;padding:0;list-style:none}
.fp-zeitachse li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-left:2px solid var(--line,#11110f26);font-size:14px}
.fp-zeitachse li.is-jetzt{border-left-color:var(--green,#244635);background:#e8f0ea;font-weight:700}
.fp-zeitachse li.is-spaet{border-left-color:#a67f45;background:#f6ecd9}
.fp-zeitachse .uhr{font-weight:700;font-variant-numeric:tabular-nums}
.fp-zeitachse .wer{overflow-wrap:anywhere}
.fp-zeitachse .wo{color:var(--muted,#6d675f);font-size:12.5px;white-space:nowrap}
.fp-zeitachse .leer{grid-column:1 / -1;color:var(--muted,#6d675f);border-left-color:transparent}

.fp-einstellungen{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.fp-einstellungen li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line,#11110f14);font-size:14px}
.fp-einstellungen b{color:var(--muted,#6d675f);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@media(max-width:760px){
  .fp-kachel b{font-size:28px}
  .fp-einstellungen li{grid-template-columns:1fr}
  .fp-zeitachse li{grid-template-columns:54px minmax(0,1fr)}
  .fp-zeitachse .wo{grid-column:2}
}

/* Aussenkante des Raums. Eine kraeftige Linie, damit der Grundriss als Raum
   lesbar ist und nicht als Ansammlung von Tischen. */
.fp-svg .fp-raum{fill:none;stroke:#11110f;stroke-width:3;vector-effect:non-scaling-stroke}

/* Die Raumflaeche steht vor den Tischzahlen und ist optisch abgesetzt: erst
   der Raum, dann was hineinpasst. */
.fp-raumfeld{flex:1 1 100%;gap:12px;padding:10px 0;border-bottom:1px solid var(--line,#11110f14)}
.fp-raumfeld .fp-mass input{width:78px}

/* Weggenommene Ecke: dieser Bereich gehoert nicht zum Gastraum. Er wird in
   der Seitenfarbe gefuellt und ueberdeckt damit die Aussenkante - so entsteht
   aus Rechteck minus Rechteck eine L- oder U-Form. Der eigene Rand bleibt,
   damit die neue Kante genauso kraeftig ist wie die alte. */
.fp-svg .fp-ausschnitt{fill:var(--paper,#f3efe6);stroke:#11110f;stroke-width:3;vector-effect:non-scaling-stroke}

/* Raum zeichnen: der Entwurf ist gestrichelt und gruen, die gesetzten Punkte
   sind Griffe. Der erste Punkt ist hervorgehoben - ihn klickt man zum
   Schliessen der Form. */
.fp-svg .fp-entwurf{fill:#24463514;stroke:var(--green,#244635);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.fp-svg .fp-punkt{fill:#fff;stroke:var(--green,#244635);stroke-width:2;vector-effect:non-scaling-stroke}
.fp-svg .fp-punkt.ist-erster{fill:var(--green,#244635)}
.fp-zeichnen .fp-svg{cursor:crosshair}

/* Takeaway-Karte im Cockpit: ein Textfeld, eine Zeile je Gericht. */
#fpTakeawayText{width:100%;max-width:640px;min-height:120px;padding:10px 12px;border:1px solid var(--line,#11110f26);border-radius:8px;font:inherit;font-size:14px;line-height:1.5;background:#fff;resize:vertical}

  </style>
</head>
