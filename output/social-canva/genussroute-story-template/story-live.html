ight:8%;top:77%;text-align:center;color:#c8c6c2;font-size:clamp(8px,1.5vw,11px);font-weight:500;letter-spacing:.18em;text-transform:uppercase}.url{position:absolute;z-index:4;left:8%;right:8%;bottom:8%;padding-top:16px;border-top:1px solid #ffffff34;text-align:center;color:#c8c6c2;font-size:clamp(8px,1.6vw,11px);letter-spacing:.1em;text-transform:lowercase}.top-image{position:absolute;z-index:1;right:-7%;bottom:13%;width:48%;height:27%;overflow:hidden;opacity:.34;transform:rotate(-4deg)}.top-image img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.14)}.top-image:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--night),transparent 58%),linear-gradient(180deg,transparent,var(--night))}.truck{position:absolute;z-index:6;left:0;bottom:3.5%;width:50%;filter:drop-shadow(0 9px 11px #0008);animation:drive 6s cubic-bezier(.2,.8,.2,1) infinite}.truck>img{display:block;width:100%}.truck-mark{position:absolute;left:19%;top:22%;width:34%;height:40%;display:block;object-fit:contain;filter:drop-shadow(0 1px 2px #0009)}.note{position:absolute;z-index:7;bottom:13%;left:18%;color:var(--gold);font-family:Georgia,serif;font-size:clamp(18px,4vw,30px);opacity:0;animation:note 6s ease-out infinite}.note:nth-of-type(2){left:24%;bottom:17%;animation-delay:.28s}.note:nth-of-type(3){left:29%;bottom:12%;animation-delay:.54s}@keyframes drive{0%{transform:translateX(-100%)}12%{transform:translateX(-18%)}72%{transform:translateX(160%)}100%{transform:translateX(160%)}}@keyframes note{0%,12%{opacity:0;transform:translate(0,8px) rotate(0)}26%{opacity:1}72%,100%{opacity:0;transform:translate(-80px,-40px) rotate(-20deg)}}@media(prefers-reduced-motion:reduce){.truck{animation:none;transform:translateX(18%)}.note{display:none}}
